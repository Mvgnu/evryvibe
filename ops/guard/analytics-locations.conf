# Suppress forged-search/headless beacons without affecting ordinary analytics.
location = /api/minilytics {
    access_log /var/log/evryvibe/guard.log evg_guard;
    if (-f /etc/nginx/evryvibe-guard/guard.off) { set $evg_kill A; }
    if ($evg_beacon_drop) { access_log /var/log/evryvibe/guard.log evg_guard; return 204; }
    proxy_pass http://127.0.0.1:3300;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/minilytics/ {
    access_log /var/log/evryvibe/guard.log evg_guard;
    if (-f /etc/nginx/evryvibe-guard/guard.off) { set $evg_kill A; }
    if ($evg_beacon_drop) { access_log /var/log/evryvibe/guard.log evg_guard; return 204; }
    proxy_pass http://127.0.0.1:3300;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
