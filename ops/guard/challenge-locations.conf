location @evg_403 {
    if ($evg_challenge_on = 0) { return 403; }
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    return 403 '<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Bitte bestätigen · EVRYVIBE</title><style>body{font:16px/1.5 system-ui,sans-serif;max-width:32rem;margin:14vh auto;padding:0 24px;color:#f0f0ec;background:#0a0a0a}small{letter-spacing:.12em}h1{font-size:2rem}button{font:700 15px system-ui;min-height:48px;padding:12px 20px;border:0;background:#d8ff00;color:#080808;cursor:pointer}p{color:#b5b5b5}</style></head><body><small>EVRYVIBE</small><h1>Bitte bestätigen</h1><p>Dieser Aufruf wirkte automatisiert. Bestätige kurz, um die Veranstaltungssuche fortzusetzen.</p><form method="post" action="/_evg/pass"><button type="submit">Bestätigen und weiter</button></form></body></html>';
}
location = /_evg/pass {
    if ($evg_challenge_on = 0) { return 404; }
    limit_except POST { deny all; }
    limit_req zone=evg_pass burst=5 nodelay;
    proxy_pass http://127.0.0.1:3319;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-EVG-Net $evg_net;
    proxy_set_header Cookie "";
}
