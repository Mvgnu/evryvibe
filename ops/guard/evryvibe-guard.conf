# Keep the existing shared max-size setting; fit this added namespace in wider buckets.
variables_hash_bucket_size 128;
# CG1 origin crawler guard (EVRYVIBE Leasen), http context. Installed as /etc/nginx/conf.d/evryvibe-guard.conf.
# Used by snippets/evryvibe-leasen-app.conf (guard log, 403 in `location /`, beacon drop) and
# snippets/evryvibe-origin-lock.conf (public TLS vhost). Detector: evryvibe-guard.service
# (/usr/local/lib/evryvibe-guard/guard.py). Its includes live in /etc/nginx/evryvibe-guard/:
#   mode.conf         $evg_enforce      1 enforce, 0 shadow (`guard.py mode enforce|shadow`)
#   origin-lock.conf  $evg_origin_lock  1 refuse non-Cloudflare peers (`guard.py lock on|off`)
#   policy.conf       $evg_unshowable   generated from the app's robots.txt, SEARCH_PATH and canonical rule
#   families.map      $evg_family       generated: exact user-agent strings of hot families
#   cf-peers.conf     Cloudflare ranges for the origin lock, generated from evryvibe-cloudflare-realip.conf
#   openai.conf       OpenAI egress (published lists + RIPE OpenAI network), generated daily: never blocked
#   old.conf          $evg_old_enforce  1 = the stale-Chrome/Edge rule (o...) blocks, 0 = it only logs would-old
#   pair.conf / pairs.map  single-network rule S1: switch and the generated network|user-agent pairs
#   sweep.conf / sweeps.map  CG2 broad-sweep rule SW: switch and the generated user-agent|accept-language fingerprints
#   runtime.conf / runtimes.map  CG2 r2 script-runtime rule RT: switch and the generated runtime-family patterns
# Nothing here names an address, an ASN or an incident's user-agent string.

log_format evg_guard '$time_iso8601\t$remote_addr\t$realip_remote_addr\t$request_method\t$request_uri\t$status\t$http_referer\t$http_user_agent\t$http_sec_fetch_site\t$http_sec_fetch_mode\t$http_sec_fetch_dest\t$http_sec_fetch_user\t$http_sec_ch_ua\t$http_sec_ch_ua_platform\t$http_accept_language\t$http_cf_ipcountry\t$http_rsc$http_next_router_prefetch\t$evg_family\t$evg_verdict\t$request_time\t$host\t$evg_origin_refuse\t$http_signature_agent\t$evg_sweep\t$evg_runtime';

include /etc/nginx/evryvibe-guard/mode.conf;
include /etc/nginx/evryvibe-guard/challenge.conf;    # $evg_challenge_on: 403 page with the "kein Bot" button
include /etc/nginx/evryvibe-guard/pass-secret.conf;  # $evg_pass_secret (0600), shared with guard.py's issuer
include /etc/nginx/evryvibe-guard/origin-lock.conf;
include /etc/nginx/evryvibe-guard/policy.conf;
include /etc/nginx/evryvibe-guard/old.conf;
include /etc/nginx/evryvibe-guard/pair.conf;   # $evg_pair_enforce: 1 = the single-network rule S1 blocks, 0 = logs
include /etc/nginx/evryvibe-guard/blind-docs.conf;  # $evg_blind_docs: 1 = blind on every document page, 0 = logs there
include /etc/nginx/evryvibe-guard/sweep.conf;  # $evg_sweep_enforce: 1 = the broad-sweep rule SW blocks, 0 = logs
include /etc/nginx/evryvibe-guard/runtime.conf;  # $evg_runtime_enforce: 1 = the script-runtime rule RT blocks, 0 = logs

# CG2 r2 RT: script-runtime / HTTP-library families learned by the detector (Bun, node, Go-http-client, ...; never curl,
# Wget, Python-urllib or Dart): case-insensitive token pattern -> runtime id (24 h after the family's last document).
map $http_user_agent $evg_runtime {
    default "";
    include /etc/nginx/evryvibe-guard/runtimes.map;
}
# The owner's networks, the VPS and loopback (guard.py OWNER_NETS is the same list): never RT-blocked.
geo $remote_addr $evg_owner {
    default 0;
    127.0.0.0/8 1;
    ::1 1;
    87.58.154.89 1;
}

# CG2 SW broad sweeps learned by the detector: "user-agent|accept-language" -> sweep id (24 h). A fingerprint, not a
# user agent: real people who share the string with another language are not in it.
map "$http_user_agent|$http_accept_language" $evg_sweep {
    default "";
    include /etc/nginx/evryvibe-guard/sweeps.map;
}

# S1 single-network scrapers learned by the detector: "network|user-agent" -> pair id (24 h).
map "$evg_net|$http_user_agent" $evg_pair {
    default "";
    include /etc/nginx/evryvibe-guard/pairs.map;
}

# OpenAI's agents are welcome (owner policy): their egress ranges and a Signature-Agent naming chatgpt.com are exempt
# from every rule, like self-declared crawlers.
geo $remote_addr $evg_openai {
    default 0;
    include /etc/nginx/evryvibe-guard/openai.conf;
}
map $http_signature_agent $evg_sigagent {
    default 0;
    "~*chatgpt\.com" 1;
}
# Google's Chrome Private Prefetch Proxy fetches result pages ahead of a click for real people (Google egress, result
# page as referrer, Sec-Fetch-Site none): exempt like OpenAI. List: prefetch-proxy.txt (Google's published geofeed).
geo $remote_addr $evg_p3 {
    default 0;
    include /etc/nginx/evryvibe-guard/prefetch-proxy.conf;
}
map "$evg_crawler$evg_openai$evg_sigagent$evg_p3" $evg_exempt {
    default 1;
    "0000" 0;
}
# S1 pairs only ever block requests without any fetch metadata (the shape of a scripted HTTP client with a browser UA).
map $http_sec_fetch_site $evg_nosfs {
    default 0;
    "" 1;
}
# Typed, pasted and bookmarked navigations of real people carry Sec-Fetch-User ?1; scripted page loads do not.
map $http_sec_fetch_user $evg_sfu {
    default 1;
    "" 0;
}
# The guard's network unit (IPv4 /24, IPv6 /64) binds the pass cookie, so one pressed button does not pass a fleet.
map $remote_addr $evg_net {
    default $remote_addr;
    "~^(?<evgn4>[0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+$" $evgn4;
    "~^(?<evgn6>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):" $evgn6;
}

map $http_user_agent $evg_family {
    default "";
    include /etc/nginx/evryvibe-guard/families.map;
}

# Crawlers and tools that say who they are are never blocked (guard.py CRAWLER is the same expression).
map $http_user_agent $evg_crawler {
    default 0;
    "~*bot|crawl|spider|slurp|Google-|GoogleOther|ChatGPT-User|OAI-SearchBot|Claude-User|Perplexity-User|meta-external|facebookexternalhit|HetrixTools|openai-mcp|evryvibe-|Lighthouse|PageSpeed" 1;
}

# Search engines differ: Google never shows a filtered URL, Bing-powered engines do. "google" uses $evg_unshowable,
# "search" (every other engine) only what robots.txt keeps out ($evg_unshowable_robots).
map $http_referer $evg_ref {
    default ext;
    "" none;
    "~*^https?://(www\.)?evryvibe\.com(/|$)" self;
    "~*^https?://((www|de)\.)?google\.[a-z.]{2,12}(/|$)" google;
    "~*^https?://((www|de|search|html|lite|start)\.)?(bing|duckduckgo|yahoo|ecosia|qwant|yandex|startpage|brave|baidu|seznam)\.[a-z.]{2,12}(/|$)" search;
}
# Any campaign-tagged landing (utm_source: Deal-Alarm mails, ChatGPT and other assistants, newsletters) is exempt.
map $args $evg_utm {
    default 0;
    "~(^|&)utm_source=" 1;
}
# The referrerless shape is for desktop browsers only: reduced Android UAs are one string per Chrome version and
# stale WebViews belong to real people.
# Client hints count too: an Android browser in "desktop site" mode (DuckDuckGo's app opens results with Sec-Fetch-Site
# none and its referrer) sends a desktop UA but Sec-CH-UA-Platform "Android" / Sec-CH-UA-Mobile ?1. The fleets send
# "Linux" or no hints.
map $http_user_agent $evg_ua_desktop {
    default 1;
    "~*Mobile|Android|iPhone|iPad|; wv\)" 0;
}
map "$http_sec_ch_ua_platform|$http_sec_ch_ua_mobile" $evg_ch_mobile {
    default 0;
    "~*^\"?Android\"?\|" 1;
    "~\|\?1$" 1;
}
map "$evg_ua_desktop$evg_ch_mobile" $evg_desktop {
    default 0;
    "10" 1;
}

# A navigation: GET/HEAD, no RSC or prefetch marker, fetch metadata (if any) says navigate/document, not an asset.
map $uri $evg_asset {
    default 0;
    "~^/(_next/|brand-media|brand-favicons|branding/|editorial/|fonts/|media/|favicon|icon|apple-icon|robots\.txt|sitemap|\.well-known/|manifest|opengraph|twitter-image|cdn-cgi/|api/|oauth)" 1;
}
map "$request_method|$http_rsc$arg__rsc$http_next_router_prefetch|$http_sec_fetch_mode|$http_sec_fetch_dest|$evg_asset" $evg_doc {
    default 0;
    "~^(GET|HEAD)\|\|(navigate|nested-navigate)?\|(document|iframe|frame)?\|0$" 1;
}

# Desktop Chromium browsers never send `Sec-Fetch-Site: none` (or no fetch metadata at all) together with another
# site's referrer: a click from a result page is cross-site, and reload, back, a new tab and session restore also
# arrive cross-site with the original referrer (critic r5 L1). Only a navigation started by automation with a
# referrer argument has that shape (measured with Chromium, WebKit and Firefox, see the CG1 report). Firefox and
# WebKit can produce it on back/reload, so for them it is logged only. Mobile apps can (DuckDuckGo's Android browser
# opens results with none + its referrer), which is why blind is desktop only, by UA and by client hints.
map $http_user_agent $evg_chromium {
    default 0;
    "~Chrome/[0-9]+" 1;
}
map $http_sec_fetch_site $evg_blind {
    default 0;
    "" 1;
    none 1;
}

# AI-assistant referrals are never blocked: ChatGPT appends utm_source=chatgpt.com to cited links, the apps send
# their own referrer or none at all (nothing may depend on this; it only adds protection).
map "$args" $evg_ai_utm {
    default 0;
    "~*(^|&)utm_source=(chatgpt(\.com)?|openai(\.com)?|copilot(\.com|\.microsoft\.com)?|perplexity(\.ai)?|gemini(\.google\.com)?|claude(\.ai)?|mistral(\.ai)?|deepseek(\.com)?|grok(\.com)?|meta\.ai)(&|$)" 1;
}
map $http_referer $evg_ai_ref {
    default 0;
    "~*^(https?://([a-z0-9-]+\.)*(chatgpt\.com|openai\.com|perplexity\.ai|copilot\.microsoft\.com|gemini\.google\.com|claude\.ai|mistral\.ai|deepseek\.com|grok\.com|meta\.ai)(/|$)|android-app://(com\.openai\.chatgpt|ai\.perplexity\.app\.android|com\.microsoft\.copilot|com\.google\.android\.apps\.bard|com\.anthropic\.claude))" 1;
}
map "$evg_ai_utm$evg_ai_ref" $evg_ai {
    default 1;
    "00" 0;
}

# Rule: a navigation on a URL no search engine shows ($evg_unshowable), not from a self-declared crawler, and
#   family  a search-engine referrer from a hot family (f... learned from forged search landings on >= 3 networks,
#           d... from referrerless landings on that campaign's own target URLs), or no referrer from a d... family;
#   blind   a search-engine referrer from a desktop Chromium browser with blind fetch metadata (per request, no
#           learning). Round 5: on every document page (blinddoc), not only unshowable URLs; blind-docs.conf 1 blocks,
#           0 logs would-blind there.
#   old     no referrer and no Sec-Fetch-User from an o... family (stale desktop Chrome or Edge, 10 networks), on any
#           document page (round 4): blocks when old.conf says 1, else logged as would-old.
#   pair    a navigation without any Sec-Fetch-Site / Sec-Fetch-User from a learned S1 network|user-agent pair:
#           blocks when pair.conf says 1, else logged as would-pair.
#   sweep   (CG2) a desktop navigation with blind fetch metadata and no referrer, or a self referrer with Sec-Fetch-User
#           ?1 or without any fetch metadata (CG2 r2, critic F1: real back/reload is none + self WITHOUT ?1), from a
#           learned SW fingerprint: blocks when sweep.conf says 1, else would-sweep.
#   runtime (CG2 r2) a document request from a learned script-runtime family outside the owner's networks: plain 403
#           (no button) when runtime.conf says 1, else would-runtime. Only exempt clients (crawlers, OpenAI, the
#           prefetch proxy) and the owner's networks are spared; it needs no browser shape.
# Key: exempt (crawler/OpenAI), AI referral, utm | navigation | referrer class | unshowable (Google set, robots set) |
# family | Chromium, blind fetch metadata (Sec-Fetch-Site none or absent) | desktop, Sec-Fetch-User present |
# S1 pair | no Sec-Fetch-Site | SW sweep | RT runtime, owner network.
# A genuine cross-site or same-origin navigation is never blocked: every pattern needs blind fetch metadata.
# blind is desktop only: Android search apps open results with their referrer and Sec-Fetch-Site none.
map "$evg_exempt$evg_ai$evg_utm|$evg_doc|$evg_ref|$evg_unshowable$evg_unshowable_robots|$evg_family|$evg_chromium$evg_blind|$evg_desktop$evg_sfu|$evg_pair|$evg_nosfs|$evg_sweep|$evg_runtime$evg_owner" $evg_hit {
    default "";
    "~^0..\|1\|.*\|r[0-9a-f]+0$" runtime;
    "~^000\|1\|google\|1.\|[fd][0-9a-f]+\|.1\|" family;
    "~^000\|1\|search\|.1\|[fd][0-9a-f]+\|.1\|" family;
    "~^000\|1\|none\|1.\|d[0-9a-f]+\|.1\|10\|" family;
    "~^000\|1\|none\|..\|o[0-9a-f]+\|.1\|10\|" old;
    "~^000\|1\|google\|1.\|(o[0-9a-f]+)?\|11\|1.\|" blind;
    "~^000\|1\|search\|.1\|(o[0-9a-f]+)?\|11\|1.\|" blind;
    "~^000\|1\|(google|search)\|..\|[^|]*\|11\|1.\|" blinddoc;
    "~^000\|1\|[^|]*\|..\|[^|]*\|.1\|.0\|p[0-9a-f]+\|1\|" pair;
    "~^000\|1\|none\|..\|[^|]*\|.1\|1.\|[^|]*\|.\|s[0-9a-f]+\|" sweep;
    "~^000\|1\|self\|..\|[^|]*\|.1\|11\|[^|]*\|.\|s[0-9a-f]+\|" sweep;
    "~^000\|1\|self\|..\|[^|]*\|.1\|1.\|[^|]*\|1\|s[0-9a-f]+\|" sweep;
    "~^000\|1\|(google|search)\|1.\|(o[0-9a-f]+)?\|(01\|..|11\|0.)\|" watch;
}

# The way back for a real person: the 403 page carries one button; POST /_evg/pass (evryvibe-guard-pass.service) sets
# evg_h/evg_e, nginx checks them with secure_link (md5 over expiry, user agent, client network and $evg_pass_secret).
map "$evg_challenge_sw$secure_link" $evg_passed {
    default 0;
    "11" 1;
}
# $evg_kill (set per request in the app snippet from files, no reload needed): A = guard.off, F = families.off.
# Declared here so the maps can use it; the app snippet overwrites it with `set` when a kill file exists.
map $host $evg_kill {
    default "";
}
# Key: hit : enforce : passed : kill (A guard.off, F families.off) : old pair blind-docs sweep runtime (.conf switches)
map "$evg_hit:$evg_enforce:$evg_passed:$evg_kill:$evg_old_enforce$evg_pair_enforce$evg_blind_docs$evg_sweep_enforce$evg_runtime_enforce" $evg_verdict {
    default "";
    "~^family:1:0::" block-family;
    "~^blind:1:0:F?:" block-blind;
    "~^old:1:0::1....$" block-old;
    "~^pair:1:0::.1...$" block-pair;
    "~^blinddoc:1:0:F?:..1..$" block-blind;
    "~^sweep:1:0::...1.$" block-sweep;
    "~^runtime:1:.::....1$" block-runtime;
    "~^runtime:" would-runtime;
    "~^sweep:1:1:" pass-sweep;
    "~^sweep:" would-sweep;
    "~^blinddoc:1:1:" pass-blind;
    "~^blinddoc:" would-blind;
    "~^pair:1:1:" pass-pair;
    "~^pair:" would-pair;
    "~^family:1:1:" pass-family;
    "~^blind:1:1:" pass-blind;
    "~^old:1:1:" pass-old;
    "~^family:" would-family;
    "~^blind:" would-blind;
    "~^old:" would-old;
    "~^watch:" watch-blind;
}
# The 403 page: the button page for every block except RT (a script runtime cannot press a button: plain 403).
# challenge.conf sets the switch $evg_challenge_sw; the app snippet reads $evg_challenge_on.
map $evg_verdict $evg_bare {
    default 0;
    block-runtime 1;
}
map "$evg_challenge_sw$evg_bare" $evg_challenge_on {
    default 0;
    "10" 1;
}
# Test hook on the private preview port only: X-PG-Test: block forces the block (to exercise the button).
map "$server_port:$http_x_evg_test:$evg_passed" $evg_testblock {
    default 0;
    "3303:block:0" 1;
}
map "$evg_verdict|$evg_testblock" $evg_block {
    default 0;
    "~^block-" 1;
    "~\|1$" 1;
}

# A minilytics beacon is sent by one of this site's pages, so its referrer is that page. A search-engine referrer on
# a beacon means the client writes its own referrer header: drop it (enforce mode only).
# Our own browser harness (HeadlessChrome, or the evryvibe-harness marker) never reaches minilytics.
map $http_user_agent $evg_harness {
    default 0;
    "~*HeadlessChrome|evryvibe-harness" 1;
}
map "$evg_harness|$evg_exempt|$evg_ref|$evg_enforce|$evg_kill" $evg_beacon_drop {
    default 0;
    "~^1\|" 1;
    "0|0|google|1|" 1;
    "0|0|search|1|" 1;
    "0|0|google|1|F" 1;
    "0|0|search|1|F" 1;
}

# Guard log: everything in the EVRYVIBE vhosts except images, fonts and build assets.
map $uri $evg_loggable {
    default 1;
    "~^/(_next/|fonts/|media/|api/|oauth/|mcp|ops|[.]well-known/)" 0;
}

# Origin lock: the public vhost accepts only Cloudflare peers and loopback; the ACME path stays open.
geo $realip_remote_addr $evg_cf_peer {
    default 0;
    127.0.0.1 1;
    ::1 1;
    include /etc/nginx/evryvibe-guard/cf-peers.conf;
}
map $uri $evg_acme {
    default 0;
    "~^/\.well-known/acme-challenge/" 1;
}
map "$evg_origin_lock$evg_cf_peer$evg_acme" $evg_origin_refuse {
    default 0;
    "100" 1;
}
# lock.off (file, checked per request in the origin-lock snippet) overrides the refusal.
map $host $evg_lock_off {
    default "";
}
map "$evg_origin_refuse:$evg_lock_off" $evg_lock_refuse {
    default 0;
    "1:" 1;
}

limit_req_zone $binary_remote_addr zone=evg_pass:1m rate=5r/m;
