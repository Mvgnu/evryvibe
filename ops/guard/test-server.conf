# Temporary, loopback-only acceptance server; remove after verification.
server {
    listen 127.0.0.1:3303;
    server_name evryvibe.com;
    include /etc/nginx/evryvibe-guard/server.conf;
    include /etc/nginx/evryvibe-guard/challenge-locations.conf;
    location / {
        include /etc/nginx/evryvibe-guard/check.conf;
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host evryvibe.com;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
