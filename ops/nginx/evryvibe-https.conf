server {
    listen 80;
    server_name evryvibe.com www.evryvibe.com;
    access_log off;
    error_log /var/log/evryvibe/nginx-error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /ops { return 503; }
    location ^~ /ops/ { return 503; }
    location / { return 301 https://evryvibe.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.evryvibe.com;
    access_log off;
    error_log /var/log/evryvibe/nginx-error.log warn;
    ssl_certificate /etc/letsencrypt/live/evryvibe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evryvibe.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://evryvibe.com$request_uri;
}
server {
    listen 443 ssl;
    server_name evryvibe.com;
    access_log off;
    error_log /var/log/evryvibe/nginx-error.log warn;
    ssl_certificate /etc/letsencrypt/live/evryvibe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evryvibe.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EVRYVIBE_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 1m;
    location ~ ^/(mcp/?$|oauth/|\.well-known/oauth-) {
        proxy_pass http://127.0.0.1:3301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
